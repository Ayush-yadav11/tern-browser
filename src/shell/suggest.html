<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
  <title>Suggestions</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--text); user-select: none; }
    #list { height: 100%; padding: 4px; background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
    .row { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: calc(var(--radius) * .7); }
    .row:hover { background: var(--hover); }
    .row.on { background: var(--accent); color: var(--on-accent); }
    .row.on .sub, .row.on .kind { color: inherit; opacity: .8; }
    .kind { flex: none; width: 16px; text-align: center; color: var(--muted); }
    .title { flex: 0 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sub { flex: 1 1 0; min-width: 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <div id="list" role="listbox" aria-label="Suggestions"></div>
  <script src="suggest.js"></script>
</body>
</html>
